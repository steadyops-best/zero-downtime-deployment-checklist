name: Test and Release
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m py_compile tools/release_gate.py
      - run: python -m unittest discover -s tests -v
      - run: python tools/release_gate.py examples/release.json --output /tmp/report.md
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          tar -czf zero-downtime-release-kit.tar.gz README.md checklist.md release-evidence-template.md tools examples LICENSE CITATION.cff
          sha256sum zero-downtime-release-kit.tar.gz > zero-downtime-release-kit.tar.gz.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            zero-downtime-release-kit.tar.gz
            zero-downtime-release-kit.tar.gz.sha256
